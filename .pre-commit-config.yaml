# Install once with:  pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Stops reference videos (or other big files) from being committed by accident.
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # mypy runs from the project's own environment so it sees the installed
  # numpy / OpenCV types: activate the venv (source venv/bin/activate)
  # before committing.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (types)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
