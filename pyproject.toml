[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-capture"
version = "0.2.0"
description = "Webcam motion matching: compare a veena player's finger movements with a reference video."
readme = "README.md"
# mediapipe 0.10.21 (the last release with the `mp.solutions` API) has wheels for 3.9-3.12 only.
requires-python = ">=3.9,<3.13"
dependencies = [
    # 0.10.30 removed `mp.solutions`, which the hand tracker uses. See docs/troubleshooting.md.
    "mediapipe>=0.10.14,<=0.10.21",
    # mediapipe 0.10.x requires numpy 1.x.
    "numpy>=1.24,<2",
    # The contrib build, because mediapipe 0.10.x depends on it; installing
    # opencv-python as well would make two packages fight over `cv2`.
    "opencv-contrib-python>=4.8,<5",
    # TOML config files: built into Python 3.11+ as tomllib.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
motion-capture = "motion_capture.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Marks the package as type-annotated for mypy users.
motion_capture = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
# The original full-body script is kept unchanged on purpose.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax for the target version)
    "SIM", # simplifications
    "N",   # naming conventions
]

[tool.ruff.lint.isort]
known-first-party = ["motion_capture"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
# mypy can only check as 3.10+; ruff's target-version = "py39" keeps the syntax 3.9-safe.
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
# mediapipe ships no type information; tomli is only installed on Python < 3.11.
module = ["mediapipe", "mediapipe.*", "tomli"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: runs MediaPipe on sample clips (slower; downloads two sample images once)",
]
filterwarnings = [
    # Raised by the protobuf version mediapipe 0.10.x pins; not our code.
    "ignore:Type google._upb._message:DeprecationWarning",
]

[tool.coverage.run]
source = ["motion_capture"]
branch = true
